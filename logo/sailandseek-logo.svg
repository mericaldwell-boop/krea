<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" width="1000" height="1000">
  <defs>
    <clipPath id="c"><circle cx="500" cy="500" r="405"/></clipPath>
    <clipPath id="sun"><circle cx="500" cy="560" r="230"/></clipPath>
  </defs>
  <rect width="1000" height="1000" fill="#FAF3E0"/>
  <circle cx="500" cy="500" r="460" fill="#1D3557"/>
  <circle cx="500" cy="500" r="428" fill="none" stroke="#FAF3E0" stroke-width="6"/>
  <g clip-path="url(#c)">
    <rect x="0" y="0" width="1000" height="1000" fill="#FAF3E0"/>
    <g transform="translate(0 -55)">
    <!-- retro striped sun -->
    <g clip-path="url(#sun)">
      <rect x="250" y="320" width="500" height="70" fill="#F9C74F"/>
      <rect x="250" y="390" width="500" height="50" fill="#F8961E"/>
      <rect x="250" y="452" width="500" height="40" fill="#F26B5B"/>
      <rect x="250" y="504" width="500" height="26" fill="#E5484D"/>
      <rect x="250" y="542" width="500" height="14" fill="#C9374B"/>
    </g>
    <!-- sea -->
    <rect x="0" y="560" width="1000" height="500" fill="#2A9D8F"/>
    <path d="M90 625 q45 -22 90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0 t90 0" fill="none" stroke="#FAF3E0" stroke-width="12" stroke-linecap="round" opacity=".85"/>
    <!-- sailboat -->
    <g transform="translate(600 430)">
      <path d="M40 0 L40 120 L-30 120 Z" fill="#FAF3E0" stroke="#1D3557" stroke-width="8" stroke-linejoin="round"/>
      <path d="M52 20 L52 120 L105 120 Z" fill="#FAF3E0" stroke="#1D3557" stroke-width="8" stroke-linejoin="round"/>
      <path d="M-45 132 L120 132 L98 160 L-25 160 Z" fill="#1D3557"/>
    </g>
    <!-- wordmark -->
    <text x="500" y="760" text-anchor="middle" font-family="Inter" font-weight="900" font-size="112" letter-spacing="2" fill="#FAF3E0">SAIL &amp;</text>
    <text x="500" y="878" text-anchor="middle" font-family="Inter" font-weight="900" font-size="112" letter-spacing="10" fill="#F9C74F">SEEK</text>
    </g>
  </g>
</svg>
